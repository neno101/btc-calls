name: btc-calls
on:
  schedule:
    - cron: "5 * * * *"         # hourly, at 5 past (GitHub is busiest on the hour; UTC doesn't matter for an hourly schedule)
  workflow_dispatch: {}          # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: btc-calls
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Score the last call and make the next one
        env:
          HORIZON_MIN: "60"
          MIN_GAP_MIN: "30"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 btc_calls.py
      - name: Save the log
        run: |
          git config user.name "btc-calls"
          git config user.email "btc-calls@users.noreply.github.com"
          git add predictions.csv data
          git diff --cached --quiet || (git commit -m "calls $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
